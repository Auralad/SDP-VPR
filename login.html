<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <title>Login – EzFinanzes</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles.css">
</head>
<body>

<header class="navbar">
    <div class="nav-title">EzFinanzes</div>
</header>

<main>
    <div class="card auth-card" style="max-width:500px;margin:auto;">
        <h2>Login</h2>

        <form id="loginForm">
            <label>E-Mail</label><br>
            <input id="email" type="email" required style="width:90%;padding:10px;margin-bottom:15px;"><br>

            <label>Passwort</label><br>
            <input id="password" type="password" required style="width:90%;padding:10px;margin-bottom:20px;"><br>

            <button type="submit" style="width:90%;padding:10px;">
                Einloggen
            </button>
        </form>

        <p style="margin-top:15px;text-align:center;">
            Noch kein Konto?
            <a href="register.html">Registrieren</a>
        </p>
    </div>
</main>

<script src="login.js"></script>
</body>
</html>
